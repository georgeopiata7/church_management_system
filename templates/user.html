<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
</head>
<body>

    <style>

/* General page styling */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f4;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
}

/* Main container */
.container {
    background-color: white;
    width: 100%;
    max-width: 500px;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

/* Headings */
h2 {
    text-align: center;
    color: #174d35;
    margin-bottom: 10px;
    font-size: 25px;
}

h3 {
    text-align: center;
    color: #555;
    font-size: 18px;
    font-weight: normal;
    margin-bottom: 30px;
}

/* Form labels */
label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: bold;
    font-size: 14px;
}

/* Input fields and dropdowns */
input,
select {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
}

/* Input focus effect */
input:focus,
select:focus {
    border-color: #174d35;
    box-shadow: 0 0 4px rgba(23, 77, 53, 0.2);
}

/* Register button */
button {
    width: 100%;
    padding: 13px;
    background-color: #174d35;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s;
}

/* Button hover effect */
button:hover {
    background-color: #103824;
}

/* Mobile responsiveness */
@media (max-width: 480px) {
    .container {
        padding: 25px 20px;
    }

    h2 {
        font-size: 21px;
    }
}

    </style>

    <div class="container">
        <h2>Church Management System</h2>
        <h3>Register New User</h3>

        <form action="/register_user" method="POST">

            <label for="">Full Name:</label>

            <input type="text" name="full_name" placeholder="Enter full Name" required>
            <br><br>

            <label for="">Email:</label>

            <input type="email" name="email" placeholder="example@gmail.com" required>

            <br><br>

            <label for="">Password:</label>
            <input type="password" name="password" placeholder="........" required>
            <br><br>

            <label for="">Contact</label>
            <input type="tel" name="contact" placeholder="0712345678" required>
            <br><br>

            <label for="">Role</label>
            <input type="text" name="role" placeholder="e.g pastor">
            <br><br>

            <button type="submit">Register User</button>

        </form>

    </div>
    
    
</body>
</html>
